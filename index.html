<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revista Digital</title>

<link rel="stylesheet" href="/css/style.css">

</head>

<body>

<!-- TOPO -->
<header class="topbar">
  <h1>Revista</h1>
</header>

<!-- HERO -->
<section class="hero">
  <h2>Destaques</h2>
</section>

<!-- 🔥 SPOTLIGHT AUTOMÁTICO -->
<section>
  <div class="spotlight" id="spotlight"></div>
</section>

<!-- 🎞️ CARROSSEL AUTOMÁTICO -->
<section class="carousel">
  <div class="carousel-track" id="carouselScroll"></div>
</section>

<!-- 🔍 BUSCA -->
<section class="search-box">
  <input type="text" id="search" placeholder="Buscar artigos...">
  <div id="results"></div>
</section>

<!-- 🧩 TEMAS AUTOMÁTICOS -->
<section>
  <h2>Temas</h2>
  <div class="thematic-grid" id="thematicGrid"></div>
</section>

<!-- RODAPÉ -->
<footer>
  <p>© Revista Digital</p>
</footer>

<!-- 🔥 SISTEMA -->
<script src="/assets/js/articles.js"></script>
<script src="/assets/js/motor.js"></script>

</body>
</html>
