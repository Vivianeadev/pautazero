<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!-- MESMO HEAD DO INDEX, com meta tags dinâmicas -->
  <title>{{TITULO}} | PautaZero</title>
  <meta property="og:title" content="{{TITULO}}">
  <meta property="og:image" content="{{URL_IMAGEM}}">
  <!-- ... resto idêntico ... -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- CABEÇALHO FIXO COM LOGO E LUPA -->
  <header class="site-header">
    <div class="header-inner">
      <div class="logo-area">
        <a href="/" class="logo">Pauta<span>Zero</span></a>
        <span class="slogan">análise · tecnologia · sistemas contemporâneos</span>
      </div>
      <div class="nav-hamburger">
        <div class="archive-btn" id="archiveBtn"><i class="fas fa-search"></i></div>
      </div>
    </div>
  </header>

  <!-- CONTEÚDO DO ARTIGO (ÚNICA PARTE QUE MUDA) -->
  <main class="container artigo-container">
    <article class="artigo-interno">
      <div class="artigo-header">
        <span class="artigo-categoria">{{EIXO}} · {{SUBCATEGORIA}}</span>
        <h1>{{TITULO}}</h1>
        <div class="artigo-imagem-destaque">
          <img src="{{URL_IMAGEM}}" alt="{{TITULO}}">
        </div>
      </div>
      <div class="artigo-conteudo">
        {{CONTEUDO_HTML}}
      </div>
    </article>

    <!-- BARRA DE COMPARTILHAMENTO (FUNCIONAL) -->
    <div class="share-bar">
      <span class="share-label"><i class="fas fa-share-alt"></i> Compartilhe:</span>
      <!-- links de compartilhamento gerados dinamicamente -->
    </div>
  </main>

  <!-- RODAPÉ COMPLETO COM POLÍTICA DE PRIVACIDADE -->
  <footer class="site-footer">
    <!-- ... idêntico ao index ... -->
  </footer>

  <!-- MODAL DA LUPA (ARQUIVO) -->
  <div class="archive-overlay" id="archiveOverlay">
    <!-- ... mesmo conteúdo ... -->
  </div>

  <!-- MODAL DE EIXOS (LUXURY-MODAL) -->
  <div class="luxury-modal" id="topicModal">
    <!-- ... mesmo conteúdo ... -->
  </div>

  <script>
    // MESMO JAVASCRIPT DO INDEX (com ajustes para o contexto do artigo)
  </script>
</body>
</html>
