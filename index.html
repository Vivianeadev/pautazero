<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="siteTitle">PautaZero · Eixos Macro & Artigos</title>
  <meta name="description" content="Portal de análise independente">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&family=Cinzel:wght@400;500;600;700&family=Marcellus&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}:root{--color-primary:#0a3147;--gold-primary:#D4AF37;--gold-dark:#B8860B;--color-bg:#fefaf5;--color-bg-card:#ffffff;--border-light:1px solid rgba(212,175,55,0.25);--shadow-luxury:0 20px 35px -12px rgba(10,49,71,0.12);--font-serif:'Cinzel',serif;--font-sans:'Inter',sans-serif;--font-body:'Marcellus',serif}body{background:var(--color-bg);color:#1e2a3a;font-family:var(--font-sans);line-height:1.55;min-height:100vh;display:flex;flex-direction:column}.container{max-width:1440px;margin:0 auto;padding:0 48px}.site-header{position:sticky;top:0;background:rgba(255,253,250,0.96);backdrop-filter:blur(12px);border-bottom:1px solid rgba(212,175,55,0.2);z-index:100;padding:1.2rem 0}.header-inner{display:flex;align-items:center;justify-content:space-between;max-width:1440px;margin:0 auto;padding:0 48px}.logo{font-size:2rem;font-weight:700;color:var(--color-primary);text-decoration:none}.logo span{color:var(--gold-dark)}.slogan{font-size:0.75rem;font-family:var(--font-body);color:var(--gold-dark);text-transform:uppercase;letter-spacing:3px;border-left:1px solid rgba(212,175,55,0.5);padding-left:18px}main{padding:4rem 0 6rem;flex:1}.published-frame{margin-bottom:4rem;border-top:2px solid var(--gold-primary);border-bottom:1px solid rgba(212,175,55,0.2);padding:2rem 0}.frame-header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2rem}.frame-header h2{font-family:var(--font-serif);font-size:1.6rem;color:var(--color-primary)}.published-two-col{display:flex;gap:2rem}.eixos-sidebar{flex:0 0 220px;border-right:1px solid rgba(212,175,55,0.2);padding-right:1.5rem}.eixo-tag-list{display:flex;flex-direction:column;gap:0.5rem}.eixo-tag{background:transparent;border:1px solid rgba(212,175,55,0.3);padding:0.6rem 0.8rem;font-family:var(--font-serif);font-size:0.75rem;cursor:pointer;display:flex;align-items:center;gap:8px}.eixo-tag.active{background:rgba(212,175,55,0.15);border-color:var(--gold-primary)}.eixo-tag .count{margin-left:auto;background:rgba(212,175,55,0.15);padding:0.15rem 0.4rem}.artigos-grid-area{flex:1}.published-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:1.5rem}.published-card{background:var(--color-bg-card);border:var(--border-light);text-decoration:none;color:inherit;transition:all 0.2s;display:flex;flex-direction:column}.published-card:hover{transform:translateY(-6px);border-color:var(--gold-primary);box-shadow:var(--shadow-luxury)}.published-card-img{width:100%;height:150px;object-fit:cover}.published-card-content{padding:1rem}.published-card-category{font-size:0.6rem;text-transform:uppercase;color:var(--gold-dark)}.published-card-title{font-family:var(--font-serif);font-size:0.9rem;font-weight:600;color:var(--color-primary)}.macro-section{margin-top:2rem}.macro-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2.5rem}.macro-card{background:var(--color-bg-card);border:var(--border-light);padding:2rem 1.8rem;cursor:pointer;text-decoration:none;color:inherit}.macro-card:hover{transform:translateY(-8px);border-color:var(--gold-primary)}.macro-icon{font-size:2.2rem;color:var(--gold-dark);margin-bottom:1.2rem}.macro-card h3{font-family:var(--font-serif);font-size:1.5rem}.site-footer{border-top:2px solid rgba(212,175,55,0.25);padding:3rem 0;background:linear-gradient(to bottom,#fefaf5,#f9f2e4);margin-top:auto}@media (max-width:850px){.published-two-col{flex-direction:column}.eixos-sidebar{border-right:none}.macro-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <div style="display:flex;align-items:baseline;gap:14px">
      <a href="/" class="logo" id="logoText">Pauta<span>Zero</span></a>
      <span class="slogan" id="sloganText">análise · tecnologia</span>
    </div>
    <button id="refreshBtn" style="background:none;border:1px solid var(--gold-primary);padding:0.5rem 1rem;border-radius:30px;color:var(--gold-dark);cursor:pointer"><i class="fas fa-sync-alt"></i> Atualizar</button>
  </div>
</header>
<main class="container">
  <section class="published-frame">
    <div class="frame-header"><h2><i class="fas fa-check-circle"></i> Artigos Publicados</h2><span id="publishedCount">0</span></div>
    <div class="published-two-col">
      <div class="eixos-sidebar"><div class="eixo-tag-list" id="eixoTagList"></div></div>
      <div class="artigos-grid-area"><div id="publishedGrid" class="published-grid"></div></div>
    </div>
  </section>
  <section class="macro-section">
    <h2 style="font-family:var(--font-serif);text-align:center;margin-bottom:2rem">Eixos de Análise</h2>
    <div class="macro-grid" id="macroGrid"></div>
  </section>
</main>
<footer class="site-footer">
  <div class="container" style="text-align:center" id="footerText">© 2026 PautaZero · Todos os direitos reservados</div>
</footer>
<script>
(function(){
  let siteConfig = { siteName: 'PautaZero', slogan: 'análise · tecnologia', primaryColor: '#0a3147', goldColor: '#D4AF37', footerText: '© 2026 PautaZero' };
  let publishedArticles = [];
  let eixosComArtigos = new Map();

  // Tenta carregar config.json
  fetch('./config.json').then(r=>r.json()).then(c=>{
    siteConfig = c;
    applyConfig();
  }).catch(()=>{});

  function applyConfig(){
    document.title = siteConfig.siteName + ' · Eixos Macro & Artigos';
    document.getElementById('logoText').innerHTML = siteConfig.siteName.replace(/(\w+)/, '<span>$1</span>');
    document.getElementById('sloganText').textContent = siteConfig.slogan;
    document.getElementById('footerText').textContent = siteConfig.footerText;
    document.documentElement.style.setProperty('--color-primary', siteConfig.primaryColor);
    document.documentElement.style.setProperty('--gold-primary', siteConfig.goldColor);
    document.documentElement.style.setProperty('--gold-dark', siteConfig.goldColor);
  }

  const macroEixos = {
    "sustentabilidade":{title:"Sustentabilidade",icon:"fas fa-leaf",desc:"Meio ambiente e futuro"},
    "direito-justica-seguranca":{title:"Direito e Justiça",icon:"fas fa-gavel",desc:"Ordem e instituições"},
    "politica-poder":{title:"Política e Poder",icon:"fas fa-landmark",desc:"Geopolítica e governança"},
    "saude-mental":{title:"Saúde Mental",icon:"fas fa-brain",desc:"Bem-estar emocional"},
    "saude-fisica":{title:"Saúde Física",icon:"fas fa-heartbeat",desc:"Medicina e longevidade"},
    "nutricao":{title:"Nutrição",icon:"fas fa-apple-alt",desc:"Performance e saúde"},
    "economia":{title:"Economia",icon:"fas fa-chart-line",desc:"Finanças e mercados"},
    "tecnologia":{title:"Tecnologia",icon:"fas fa-robot",desc:"IA e inovação"},
    "sociedade":{title:"Sociedade",icon:"fas fa-users",desc:"Família e valores"},
    "esportes":{title:"Esportes",icon:"fas fa-futbol",desc:"Análise esportiva"},
    "agro":{title:"Agronegócio",icon:"fas fa-truck",desc:"Logística e produção"}
  };

  async function loadArticles(){
    try{
      const res = await fetch('./data.json?v='+Date.now());
      const data = await res.json();
      publishedArticles = [];
      eixosComArtigos.clear();
      if(data.articles && Array.isArray(data.articles)){
        data.articles.forEach(art => {
          publishedArticles.push(art);
          if(art.macroKey){
            if(!eixosComArtigos.has(art.macroKey)) eixosComArtigos.set(art.macroKey, {title:art.macroTitle,icon:art.macroIcon,count:0,articles:[]});
            const e = eixosComArtigos.get(art.macroKey);
            e.count++; e.articles.push(art);
          }
        });
      }
      renderAll();
    }catch(e){
      document.getElementById('publishedGrid').innerHTML = '<p>Erro ao carregar artigos. Verifique se data.json existe.</p>';
    }
  }

  function renderAll(){
    renderSidebar();
    renderGrid(publishedArticles);
    renderMacroGrid();
    document.getElementById('publishedCount').textContent = publishedArticles.length;
  }

  function renderSidebar(){
    const container = document.getElementById('eixoTagList');
    let html = `<div class="eixo-tag active" data-macro="all"><i class="fas fa-globe"></i> Todos <span class="count">${publishedArticles.length}</span></div>`;
    for(let [key,data] of eixosComArtigos){
      html += `<div class="eixo-tag" data-macro="${key}"><i class="${data.icon}"></i> ${data.title} <span class="count">${data.count}</span></div>`;
    }
    container.innerHTML = html;
    document.querySelectorAll('.eixo-tag').forEach(t=>t.addEventListener('click',function(){
      document.querySelectorAll('.eixo-tag').forEach(x=>x.classList.remove('active'));
      this.classList.add('active');
      const macro = this.dataset.macro;
      renderGrid(macro === 'all' ? publishedArticles : (eixosComArtigos.get(macro)?.articles || []));
    }));
  }

  function renderGrid(articles){
    const grid = document.getElementById('publishedGrid');
    if(!articles.length){ grid.innerHTML = '<p>Nenhum artigo neste eixo.</p>'; return; }
    grid.innerHTML = articles.map(a=>`
      <a href="${a.url}" class="published-card">
        <img class="published-card-img" src="${a.image}" alt="${escapeHtml(a.title)}" onerror="this.src='https://placehold.co/400x200/fefaf5/D4AF37?text='">
        <div class="published-card-content">
          <div class="published-card-category">${escapeHtml(a.category)}</div>
          <div class="published-card-title">${escapeHtml(a.title)}</div>
        </div>
      </a>
    `).join('');
  }

  function renderMacroGrid(){
    const grid = document.getElementById('macroGrid');
    let html = '';
    for(let [key,data] of Object.entries(macroEixos)){
      html += `<div class="macro-card"><div class="macro-icon"><i class="${data.icon}"></i></div><h3>${data.title}</h3><p>${data.desc}</p></div>`;
    }
    grid.innerHTML = html;
  }

  function escapeHtml(s){ return s.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[m]); }

  document.getElementById('refreshBtn').addEventListener('click', loadArticles);
  window.addEventListener('DOMContentLoaded', loadArticles);
})();
</script>
</body>
</html>
