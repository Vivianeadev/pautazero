<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <!-- Metadados serão preenchidos dinamicamente a partir do data.json -->
  <title id="pageTitle">PautaZero</title>
  <meta name="description" id="metaDescription" content="">
  
  <meta property="og:title" id="ogTitle" content="">
  <meta property="og:description" id="ogDescription" content="">
  <meta property="og:type" content="website">
  <meta property="og:url" id="ogUrl" content="">
  <meta property="og:image" id="ogImage" content="">
  <meta property="og:image:alt" id="ogImageAlt" content="">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" id="twitterTitle" content="">
  <meta name="twitter:description" id="twitterDescription" content="">
  <meta name="twitter:image" id="twitterImage" content="">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&family=Cinzel:wght@400;500;600;700&family=Marcellus&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* ========== ESTILOS COMPLETOS (mantidos para preservar a aparência) ========== */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --color-primary: #0a3147; --color-primary-light: #1a4b6d; --gold-primary: #D4AF37;
      --gold-secondary: #F4E4B8; --gold-dark: #B8860B; --color-dark: #1A1A1A;
      --color-text: #1e2a3a; --color-text-light: #2c3e4e; --color-bg: #fefaf5;
      --color-bg-card: #ffffff; --border-light: 1px solid rgba(212, 175, 55, 0.25);
      --shadow-luxury: 0 20px 35px -12px rgba(10, 49, 71, 0.12);
      --font-serif: 'Cinzel', serif; --font-sans: 'Inter', sans-serif; --font-body: 'Marcellus', serif;
    }
    body { background: var(--color-bg); color: var(--color-text); font-family: var(--font-sans); line-height: 1.55; -webkit-font-smoothing: antialiased; overflow-x: hidden; font-size: 0.95rem; }
    body.modal-open { overflow: hidden; }
    .container { max-width: 1280px; margin: 0 auto; padding: 0 36px; }
    h1, h2, h3, h4, .logo, .section-title { font-family: var(--font-serif); font-weight: 500; letter-spacing: -0.01em; }
    h2 { font-size: 2rem; margin-bottom: 1.5rem; font-weight: 500; color: var(--color-primary); border-bottom: 2px solid rgba(212, 175, 55, 0.35); display: inline-block; padding-bottom: 8px; }
    .site-header { position: sticky; top: 0; background: rgba(255, 253, 250, 0.96); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(212, 175, 55, 0.2); z-index: 100; padding: 1rem 0; }
    .header-inner { display: flex; align-items: center; justify-content: space-between; max-width: 1280px; margin: 0 auto; padding: 0 36px; gap: 1rem; }
    .logo-area { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
    .logo { font-size: 2rem; font-weight: 700; color: var(--color-primary); text-decoration: none; letter-spacing: 1px; }
    .logo span { color: var(--gold-dark); font-weight: 500; }
    .slogan { font-size: 0.7rem; font-family: var(--font-body); color: var(--gold-dark); text-transform: uppercase; letter-spacing: 2.5px; border-left: 1px solid rgba(212, 175, 55, 0.5); padding-left: 14px; }
    .nav-hamburger { display: flex; align-items: center; gap: 1rem; }
    .archive-btn {
      background: rgba(212, 175, 55, 0.12);
      border: 1px solid rgba(212, 175, 55, 0.3);
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      color: var(--color-primary);
      cursor: pointer;
      transition: 0.2s;
    }
    .archive-btn:hover { background: rgba(212, 175, 55, 0.25); border-color: var(--gold-primary); }
    .archive-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(10, 49, 71, 0.8); backdrop-filter: blur(6px); z-index: 1000; display: flex; align-items: center; justify-content: flex-end; opacity: 0; visibility: hidden; transition: all 0.3s ease; }
    .archive-overlay.active { opacity: 1; visibility: visible; }
    .archive-panel { background: var(--color-bg-card); width: 100%; max-width: 500px; height: 100%; right: 0; position: absolute; box-shadow: -5px 0 30px rgba(0,0,0,0.2); display: flex; flex-direction: column; transform: translateX(100%); transition: transform 0.3s ease; border-left: 1px solid var(--gold-primary); }
    .archive-overlay.active .archive-panel { transform: translateX(0); }
    .archive-header { padding: 1.5rem; border-bottom: 1px solid rgba(212,175,55,0.2); display: flex; justify-content: space-between; align-items: center; background: white; }
    .archive-header h3 { font-family: var(--font-serif); font-size: 1.3rem; color: var(--color-primary); }
    .archive-close { background: none; border: none; font-size: 1.6rem; cursor: pointer; color: var(--gold-dark); }
    .archive-search { padding: 1rem 1.5rem; border-bottom: 1px solid rgba(212,175,55,0.1); }
    .archive-search input { width: 100%; padding: 0.8rem 1rem; border: 1px solid rgba(212,175,55,0.3); font-family: var(--font-sans); font-size: 0.9rem; background: white; outline: none; }
    .archive-search input:focus { border-color: var(--gold-primary); }
    .archive-list { flex: 1; overflow-y: auto; padding: 1rem 1.5rem; }
    .archive-item { background: var(--color-bg-card); border: 1px solid rgba(212,175,55,0.15); padding: 0.8rem 1rem; margin-bottom: 0.8rem; cursor: pointer; transition: all 0.2s; display: block; text-decoration: none; color: inherit; }
    .archive-item:hover { border-color: var(--gold-primary); background: rgba(212,175,55,0.02); transform: translateX(3px); }
    .archive-item-title { font-family: var(--font-serif); font-size: 0.85rem; font-weight: 600; color: var(--color-primary); margin-bottom: 0.2rem; }
    .archive-item-meta { font-size: 0.65rem; color: var(--gold-dark); display: flex; gap: 1rem; margin-top: 0.2rem; }
    .no-results { text-align: center; padding: 2rem; color: var(--color-text-light); font-style: italic; }
    @media (max-width: 700px) {
      .slogan { display: none; }
      .header-inner { padding: 0 20px; }
      .archive-panel { max-width: 100%; }
    }
    main { padding: 3rem 0 5rem; }
    .site-footer { border-top: 1px solid rgba(212, 175, 55, 0.2); padding: 2rem 0; color: var(--color-text-light); background: var(--color-bg); font-size: 0.75rem; }
    .footer-legal { max-width: 1280px; margin: 1rem auto 0; padding: 1rem 36px 0; border-top: 1px solid rgba(212, 175, 55, 0.15); font-size: 0.65rem; line-height: 1.4; color: rgba(44, 62, 78, 0.6); text-align: center; letter-spacing: 0.3px; }

    /* Grade de cards temáticos */
    .thematic-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2rem; margin: 2rem 0 3rem; }
    .theme-card { background: var(--color-bg-card); border: var(--border-light); padding: 1.8rem 1.5rem; transition: all 0.25s ease; cursor: pointer; text-decoration: none; display: block; color: inherit; }
    .theme-card:hover { transform: translateY(-6px); border-color: var(--gold-primary); box-shadow: var(--shadow-luxury); }
    .theme-icon { font-size: 2.2rem; color: var(--gold-dark); margin-bottom: 1rem; }
    .theme-card h3 { font-family: var(--font-serif); font-size: 1.4rem; font-weight: 600; color: var(--color-primary); margin-bottom: 0.75rem; letter-spacing: -0.3px; }
    .theme-card p { font-size: 0.85rem; line-height: 1.45; color: var(--color-text-light); margin-bottom: 1rem; }
    .theme-badge { display: inline-block; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1.5px; color: var(--gold-dark); border-top: 1px solid rgba(212, 175, 55, 0.25); padding-top: 0.8rem; margin-top: 0.5rem; width: 100%; }
    @media (max-width: 900px) { .thematic-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 550px) { .thematic-grid { grid-template-columns: 1fr; } }

    /* Modal de luxo */
    .luxury-modal {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(10, 49, 71, 0.92); backdrop-filter: blur(10px);
      z-index: 2000; display: flex; align-items: center; justify-content: center;
      opacity: 0; visibility: hidden; transition: all 0.3s ease;
    }
    .luxury-modal.active { opacity: 1; visibility: visible; }
    .modal-content {
      background: var(--color-bg-card); max-width: 700px; width: 90%;
      border: 1px solid var(--gold-primary); box-shadow: 0 30px 50px rgba(0,0,0,0.3);
      padding: 2rem; transform: scale(0.95); transition: transform 0.3s ease;
      position: relative; max-height: 85vh; overflow-y: auto;
    }
    .luxury-modal.active .modal-content { transform: scale(1); }
    .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid rgba(212, 175, 55, 0.35); padding-bottom: 1rem; margin-bottom: 1.5rem; }
    .modal-header h3 { font-family: var(--font-serif); font-size: 1.5rem; color: var(--color-primary); }
    .modal-close { background: none; border: none; font-size: 1.6rem; cursor: pointer; color: var(--gold-dark); transition: 0.2s; }
    .modal-close:hover { color: var(--gold-primary); }
    .modal-subtitle { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 2px; color: var(--gold-dark); margin-bottom: 1.2rem; }
    .subcategory-group { margin-bottom: 1.8rem; border-left: 2px solid rgba(212,175,55,0.3); padding-left: 1rem; }
    .subcategory-title { font-family: var(--font-serif); font-weight: 600; font-size: 1rem; color: var(--color-primary); margin-bottom: 0.6rem; letter-spacing: -0.2px; }
    .topics-list { list-style: none; margin: 0.5rem 0 0.5rem; display: flex; flex-wrap: wrap; gap: 0.4rem 1rem; }
    .topics-list li { margin-bottom: 0.4rem; width: calc(50% - 1rem); }
    .topics-list a { text-decoration: none; font-family: var(--font-serif); font-size: 0.85rem; color: var(--color-text); border-left: 2px solid transparent; padding-left: 0.6rem; display: inline-block; transition: all 0.2s; cursor: pointer; }
    .topics-list a:hover { border-left-color: var(--gold-primary); color: var(--gold-dark); padding-left: 0.9rem; }
    .modal-footer-note { margin-top: 1.8rem; padding-top: 1rem; font-size: 0.7rem; color: var(--gold-dark); text-align: center; border-top: 1px solid rgba(212, 175, 55, 0.2); }
    @media (max-width: 550px) { .topics-list li { width: 100%; } }

    /* Seção spotlight */
    .featured-spotlight { margin-bottom: 3rem; border-bottom: 1px dashed rgba(212, 175, 55, 0.3); padding-bottom: 1.8rem; }
    .spotlight-title { font-family: var(--font-serif); font-size: 0.75rem; letter-spacing: 3px; text-transform: uppercase; color: var(--gold-dark); margin-bottom: 1.2rem; display: flex; align-items: center; gap: 10px; }
    .spotlight-grid { display: grid; grid-template-columns: 1fr 1.4fr 1fr; gap: 1.5rem; align-items: stretch; }
    .spotlight-card { background: var(--color-bg-card); border: 1px solid rgba(212, 175, 55, 0.25); transition: transform 0.2s ease, box-shadow 0.2s; cursor: pointer; overflow: hidden; display: flex; flex-direction: column; }
    .spotlight-card:hover { transform: translateY(-5px); box-shadow: var(--shadow-luxury); border-color: var(--gold-primary); }
    .card-image { width: 100%; background: linear-gradient(145deg, #e9e2d4, #d6cdbb); display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; min-height: 160px; }
    .card-image .img-placeholder { width: 100%; height: 100%; object-fit: cover; display: block; }
    .spotlight-card.larger .card-image { min-height: 200px; }
    .card-content { padding: 1.2rem 1rem 1.2rem; flex: 1; }
    .card-badge { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 2px; color: var(--gold-dark); border-left: 2px solid var(--gold-primary); padding-left: 8px; margin-bottom: 0.6rem; }
    .spotlight-card h4 { font-family: var(--font-serif); font-size: 1rem; font-weight: 600; color: var(--color-primary); margin-bottom: 0.5rem; line-height: 1.3; }
    .spotlight-card.larger h4 { font-size: 1.2rem; }
    .card-excerpt { font-size: 0.75rem; color: var(--color-text-light); margin-bottom: 0.8rem; line-height: 1.4; }
    .read-more { font-size: 0.7rem; font-weight: 500; color: var(--gold-dark); text-decoration: none; border-bottom: 1px dotted var(--gold-primary); transition: 0.2s; display: inline-block; }
    .read-more:hover { color: var(--gold-primary); border-bottom-style: solid; }
    @media (max-width: 850px) { .spotlight-grid { grid-template-columns: 1fr; gap: 1.2rem; } .spotlight-card.larger .card-image { min-height: 180px; } }

    /* Carrossel horizontal */
    .horizontal-carousel-section { margin-bottom: 3rem; }
    .carousel-header { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; margin-bottom: 1.5rem; }
    .carousel-header h3 { font-family: var(--font-serif); font-size: 1.3rem; color: var(--color-primary); letter-spacing: -0.3px; }
    .carousel-header h3 i { color: var(--gold-dark); margin-right: 8px; }
    .carousel-scroll { overflow-x: auto; scroll-snap-type: x mandatory; display: flex; gap: 1.8rem; padding-bottom: 1rem; scrollbar-width: thin; scrollbar-color: var(--gold-dark) rgba(212,175,55,0.2); cursor: grab; }
    .carousel-scroll:active { cursor: grabbing; }
    .carousel-scroll::-webkit-scrollbar { height: 6px; }
    .carousel-scroll::-webkit-scrollbar-track { background: rgba(212,175,55,0.1); border-radius: 10px; }
    .carousel-scroll::-webkit-scrollbar-thumb { background: var(--gold-dark); border-radius: 10px; }
    .carousel-card { flex: 0 0 280px; scroll-snap-align: start; background: var(--color-bg-card); border: 1px solid rgba(212, 175, 55, 0.25); transition: all 0.25s ease; cursor: pointer; text-decoration: none; color: inherit; display: flex; flex-direction: column; overflow: hidden; }
    .carousel-card:hover { transform: translateY(-6px); border-color: var(--gold-primary); box-shadow: var(--shadow-luxury); }
    .carousel-img { width: 100%; height: 160px; object-fit: cover; background: linear-gradient(145deg, #e9e2d4, #d6cdbb); transition: transform 0.3s ease; }
    .carousel-card:hover .carousel-img { transform: scale(1.02); }
    .carousel-content { padding: 1rem; }
    .carousel-category { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1.5px; color: var(--gold-dark); margin-bottom: 0.4rem; }
    .carousel-title { font-family: var(--font-serif); font-size: 1rem; font-weight: 600; color: var(--color-primary); line-height: 1.3; }
    @media (max-width: 700px) { .carousel-card { flex: 0 0 240px; } .carousel-img { height: 140px; } }
    .carousel-fade { position: relative; }
    .carousel-fade::before, .carousel-fade::after { content: ''; position: absolute; top: 0; bottom: 0; width: 40px; pointer-events: none; z-index: 2; }
    .carousel-fade::before { left: 0; background: linear-gradient(to right, var(--color-bg), transparent); }
    .carousel-fade::after { right: 0; background: linear-gradient(to left, var(--color-bg), transparent); }

    /* Barra de compartilhamento */
    .share-bar { display: flex; justify-content: flex-end; align-items: center; gap: 18px; margin: 1.5rem 0 2rem; padding-bottom: 1rem; border-bottom: 1px solid rgba(212, 175, 55, 0.2); }
    .share-bar .share-label { font-family: var(--font-serif); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1.5px; color: var(--gold-dark); }
    .share-bar a { color: var(--gold-dark); font-size: 1.2rem; transition: 0.2s; text-decoration: none; }
    .share-bar a:hover { color: var(--gold-primary); transform: translateY(-2px); }
    @media (max-width: 550px) { .share-bar { justify-content: center; } }

    /* Política de privacidade colapsável */
    .privacy-collapsible { max-width: 1100px; margin: 1.5rem auto 0.5rem; padding: 0 20px; }
    .privacy-cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem; margin-top: 1rem; }
    .privacy-col { background: rgba(255,255,245,0.4); border: 1px solid rgba(212, 175, 55, 0.2); border-radius: 4px; transition: all 0.2s; }
    .privacy-col-title { font-family: var(--font-serif); font-weight: 600; font-size: 0.85rem; text-align: center; letter-spacing: 1px; color: var(--color-primary); background: rgba(212, 175, 55, 0.08); padding: 0.9rem 0.5rem; cursor: pointer; border-bottom: 1px solid rgba(212, 175, 55, 0.2); transition: 0.2s; text-transform: uppercase; }
    .privacy-col-title:hover { background: rgba(212, 175, 55, 0.18); color: var(--gold-dark); }
    .privacy-col-content { display: none; padding: 1rem; font-size: 0.7rem; line-height: 1.5; color: var(--color-text-light); background: var(--color-bg-card); }
    .privacy-col-content p { margin-bottom: 0.6rem; }
    .privacy-col-content strong { color: var(--color-primary); font-family: var(--font-serif); font-weight: 500; }
    .privacy-col-content .privacy-email { font-family: monospace; background: rgba(212,175,55,0.1); padding: 0.1rem 0.3rem; border-radius: 6px; }
    .privacy-header-note { text-align: center; font-family: var(--font-serif); font-size: 0.7rem; letter-spacing: 1px; color: var(--gold-dark); margin-bottom: 0.5rem; }
    @media (max-width: 750px) { .privacy-cols { grid-template-columns: 1fr; gap: 0.8rem; } .privacy-collapsible { padding: 0 16px; } }
  </style>
</head>
<body>

<!-- ==================== HEADER ==================== -->
<header class="site-header">
  <div class="header-inner">
    <div class="logo-area">
      <a href="/" class="logo" id="logoText">Pauta<span>Zero</span></a>
      <div class="slogan" id="headerSlogan"></div>
    </div>
    <div class="nav-hamburger">
      <div class="archive-btn" id="archiveBtn" aria-label="Explorar edições">
        <i class="fas fa-archive"></i>
      </div>
    </div>
  </div>
</header>

<!-- Painel de arquivo (overlay) -->
<div class="archive-overlay" id="archiveOverlay">
  <div class="archive-panel">
    <div class="archive-header">
      <h3><i class="fas fa-archive"></i> Arquivo PautaZero</h3>
      <button class="archive-close" id="archiveCloseBtn"><i class="fas fa-times"></i></button>
    </div>
    <div class="archive-search">
      <input type="text" id="archiveSearchInput" placeholder="Filtrar edições..." aria-label="Buscar no arquivo">
    </div>
    <div class="archive-list" id="archiveList">
      <!-- Itens gerados via JS -->
    </div>
  </div>
</div>

<main class="container">
  <!-- Seção spotlight -->
  <section class="featured-spotlight">
    <div class="spotlight-title">
      <i class="fas fa-fire" style="color: var(--gold-dark);"></i> 
      <span id="spotlightSectionTitle">Em discussão</span>
    </div>
    <div class="spotlight-grid" id="spotlightGridContainer">
      <!-- Renderizado dinamicamente -->
    </div>
  </section>

  <!-- Cards temáticos -->
  <section>
    <div class="section-intro">
      <h2 id="thematicSectionTitle">Temas estratégicos</h2>
    </div>
    <div class="thematic-grid" id="thematicCardsContainer">
      <!-- Renderizado dinamicamente -->
    </div>
  </section>

  <!-- Carrossel horizontal (Leituras contínuas) -->
  <section class="horizontal-carousel-section carousel-fade">
    <div class="carousel-header">
      <h3><i class="fas fa-compass"></i> <span id="carouselTitle">Leituras contínuas</span></h3>
    </div>
    <div class="carousel-scroll" id="carouselContainer">
      <!-- Renderizado dinamicamente -->
    </div>
  </section>

  <!-- Barra de compartilhamento -->
  <div class="share-bar">
    <span class="share-label">Compartilhar</span>
    <a href="#" id="shareTwitter" target="_blank" rel="noopener" aria-label="Twitter"><i class="fab fa-twitter"></i></a>
    <a href="#" id="shareLinkedin" target="_blank" rel="noopener" aria-label="LinkedIn"><i class="fab fa-linkedin-in"></i></a>
    <a href="#" id="shareFacebook" target="_blank" rel="noopener" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
    <a href="#" id="shareWhatsapp" target="_blank" rel="noopener" aria-label="WhatsApp"><i class="fab fa-whatsapp"></i></a>
    <a href="#" id="shareEmail"><i class="fas fa-envelope"></i></a>
  </div>
</main>

<!-- Modal de tópicos -->
<div class="luxury-modal" id="topicModal">
  <div class="modal-content">
    <div class="modal-header">
      <h3 id="modalTitle">Explorar por eixo</h3>
      <button class="modal-close" id="closeModalBtn"><i class="fas fa-times"></i></button>
    </div>
    <div class="modal-subtitle" id="modalSubtitle">Navegue por temas estruturantes</div>
    <div id="modalTopicsList"></div>
    <div class="modal-footer-note" id="modalFooterNote">Atualizado continuamente</div>
  </div>
</div>

<!-- Footer -->
<footer class="site-footer">
  <div class="container" style="display: flex; justify-content: space-between; flex-wrap: wrap; gap: 1rem;">
    <div id="footerCopyright"></div>
    <div style="display: flex; gap: 18px; color: var(--gold-dark); align-items: center;">
      <a href="manifesto.html" style="color: inherit; text-decoration: none; transition: 0.2s; display: inline-flex; align-items: center; gap: 5px;"><i class="fas fa-scroll"></i> Manifesto Pauta Zero</a>
      <span style="color: rgba(212,175,55,0.4);">|</span>
      <i class="fab fa-linkedin"></i> <i class="fab fa-x-twitter"></i> <i class="fas fa-envelope"></i>
      <span style="font-family: monospace;">privacidade@pautazero.com</span>
    </div>
  </div>
  <div class="privacy-collapsible">
    <div class="privacy-header-note" id="privacyHeaderNote">Ética e transparência</div>
    <div class="privacy-cols" id="privacyColumnsContainer">
      <!-- Renderizado dinamicamente -->
    </div>
  </div>
  <div class="footer-legal" id="footerLegalText"></div>
</footer>

<script>
  (function() {
    // ---------- Carregar dados do data.json ----------
    fetch('./data.json')
      .then(response => {
        if (!response.ok) throw new Error('data.json não encontrado.');
        return response.json();
      })
      .then(DATA => {
        // ---------- Metadados e cabeçalho ----------
        document.title = DATA.site.title;
        document.getElementById('pageTitle').textContent = DATA.site.title;
        document.getElementById('metaDescription').setAttribute('content', DATA.site.description);
        document.getElementById('ogTitle').setAttribute('content', DATA.site.title);
        document.getElementById('ogDescription').setAttribute('content', DATA.site.description);
        document.getElementById('ogUrl').setAttribute('content', DATA.site.url);
        document.getElementById('ogImage').setAttribute('content', DATA.site.ogImage);
        document.getElementById('ogImageAlt').setAttribute('content', DATA.site.ogImageAlt);
        document.getElementById('twitterTitle').setAttribute('content', DATA.site.title);
        document.getElementById('twitterDescription').setAttribute('content', DATA.site.description);
        document.getElementById('twitterImage').setAttribute('content', DATA.site.ogImage);

        document.getElementById('logoText').innerHTML = DATA.site.logoText;
        document.getElementById('headerSlogan').textContent = DATA.site.slogan;
        document.getElementById('footerLegalText').textContent = DATA.site.footerLegal;
        document.getElementById('footerCopyright').innerHTML = `© ${new Date().getFullYear()} PautaZero · Revista de análise de sistemas, comportamento e políticas estratégicas.`;

        // ---------- Spotlight ----------
        document.getElementById('spotlightSectionTitle').textContent = DATA.spotlight.sectionTitle;
        const spotlightGrid = document.getElementById('spotlightGridContainer');
        spotlightGrid.innerHTML = DATA.spotlight.articles.map(article => `
          <div class="spotlight-card ${article.isLarger ? 'larger' : ''}" data-link="${article.link}">
            <div class="card-image">
              <img class="img-placeholder" src="${article.image}" alt="${escapeHtml(article.title)}" loading="lazy">
            </div>
            <div class="card-content">
              <div class="card-badge">${escapeHtml(article.badge)}</div>
              <h4>${escapeHtml(article.title)}</h4>
              <div class="card-excerpt">${escapeHtml(article.excerpt)}</div>
              <span class="read-more">Ler análise →</span>
            </div>
          </div>
        `).join('');

        // ---------- Cards Temáticos ----------
        document.getElementById('thematicSectionTitle').textContent = DATA.thematicCards.sectionTitle;
        const thematicContainer = document.getElementById('thematicCardsContainer');
        thematicContainer.innerHTML = DATA.thematicCards.cards.map(card => `
          <a href="${card.link}" class="theme-card">
            <div class="theme-icon">${card.icon}</div>
            <h3>${escapeHtml(card.title)}</h3>
            <p>${escapeHtml(card.description)}</p>
            <span class="theme-badge">${escapeHtml(card.badge)}</span>
          </a>
        `).join('');

        // ---------- Carrossel ----------
        document.getElementById('carouselTitle').textContent = DATA.carousel.title;
        const carouselContainer = document.getElementById('carouselContainer');
        carouselContainer.innerHTML = DATA.carousel.items.map(item => `
          <a href="${item.link}" class="carousel-card">
            <img class="carousel-img" src="${item.image}" alt="${escapeHtml(item.title)}" loading="lazy">
            <div class="carousel-content">
              <div class="carousel-category">${escapeHtml(item.category)}</div>
              <div class="carousel-title">${escapeHtml(item.title)}</div>
            </div>
          </a>
        `).join('');

        // ---------- Arquivo ----------
        const archiveListDiv = document.getElementById('archiveList');
        const archiveItems = DATA.archive.items || [];
        function renderArchiveList(filterText = '') {
          const term = filterText.toLowerCase();
          const filtered = archiveItems.filter(item => 
            item.title.toLowerCase().includes(term) || 
            item.category.toLowerCase().includes(term) ||
            item.date.toLowerCase().includes(term)
          );
          archiveListDiv.innerHTML = filtered.length ? filtered.map(item => `
            <a href="${item.link}" class="archive-item">
              <div class="archive-item-title">${escapeHtml(item.title)}</div>
              <div class="archive-item-meta">
                <span>${escapeHtml(item.date)}</span>
                <span>${escapeHtml(item.category)}</span>
              </div>
            </a>
          `).join('') : '<div class="no-results">Nenhuma edição encontrada.</div>';
        }
        renderArchiveList();

        // ---------- Modal ----------
        const modal = document.getElementById('topicModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalSubtitle = document.getElementById('modalSubtitle');
        const modalFooterNote = document.getElementById('modalFooterNote');
        const modalTopicsList = document.getElementById('modalTopicsList');
        modalTitle.textContent = DATA.modal.title;
        modalSubtitle.textContent = DATA.modal.subtitle;
        modalFooterNote.textContent = DATA.modal.footerNote;
        modalTopicsList.innerHTML = DATA.modal.topics.map(group => `
          <div class="subcategory-group">
            <div class="subcategory-title">${escapeHtml(group.category)}</div>
            <ul class="topics-list">
              ${group.items.map(item => `<li><a href="#">${escapeHtml(item)}</a></li>`).join('')}
            </ul>
          </div>
        `).join('');

        // ---------- Privacidade ----------
        document.getElementById('privacyHeaderNote').textContent = DATA.privacy.headerNote;
        const privacyCols = document.getElementById('privacyColumnsContainer');
        privacyCols.innerHTML = DATA.privacy.columns.map(col => `
          <div class="privacy-col">
            <div class="privacy-col-title">${col.title}</div>
            <div class="privacy-col-content">${col.content}</div>
          </div>
        `).join('');

        // ---------- Compartilhamento ----------
        const shareUrl = encodeURIComponent(DATA.site.url);
        const shareTitle = encodeURIComponent(DATA.site.title);
        document.getElementById('shareTwitter').href = `https://twitter.com/intent/tweet?text=${shareTitle}&url=${shareUrl}`;
        document.getElementById('shareLinkedin').href = `https://www.linkedin.com/shareArticle?mini=true&url=${shareUrl}&title=${shareTitle}`;
        document.getElementById('shareFacebook').href = `https://www.facebook.com/sharer/sharer.php?u=${shareUrl}`;
        document.getElementById('shareWhatsapp').href = `https://api.whatsapp.com/send?text=${shareTitle}%20${shareUrl}`;
        document.getElementById('shareEmail').href = `mailto:?subject=${shareTitle}&body=${shareUrl}`;

        // ---------- Interações de UI ----------
        // Overlay de arquivo
        const archiveOverlay = document.getElementById('archiveOverlay');
        const archiveBtn = document.getElementById('archiveBtn');
        const archiveCloseBtn = document.getElementById('archiveCloseBtn');
        const archiveSearchInput = document.getElementById('archiveSearchInput');

        archiveBtn.addEventListener('click', () => archiveOverlay.classList.add('active'));
        archiveCloseBtn.addEventListener('click', () => archiveOverlay.classList.remove('active'));
        archiveOverlay.addEventListener('click', (e) => {
          if (e.target === archiveOverlay) archiveOverlay.classList.remove('active');
        });
        archiveSearchInput.addEventListener('input', (e) => renderArchiveList(e.target.value));

        // Modal
        const closeModalBtn = document.getElementById('closeModalBtn');
        function openModal() { modal.classList.add('active'); document.body.classList.add('modal-open'); }
        function closeModal() { modal.classList.remove('active'); document.body.classList.remove('modal-open'); }
        closeModalBtn.addEventListener('click', closeModal);
        modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
        document.addEventListener('keydown', (e) => {
          if (e.key === 'Escape' && modal.classList.contains('active')) closeModal();
        });

        // Abrir modal ao clicar em qualquer card temático (já que os links são "#")
        document.querySelectorAll('.theme-card').forEach(card => {
          card.addEventListener('click', (e) => {
            e.preventDefault();
            openModal();
          });
        });

        // Links do spotlight: preventDefault para '#'
        document.querySelectorAll('.spotlight-card').forEach(card => {
          card.addEventListener('click', (e) => {
            const link = card.dataset.link;
            if (!link || link === '#') e.preventDefault();
          });
        });

        // Colunas de privacidade colapsáveis
        document.querySelectorAll('.privacy-col-title').forEach(title => {
          title.addEventListener('click', function() {
            const content = this.nextElementSibling;
            if (content) {
              content.style.display = content.style.display === 'block' ? 'none' : 'block';
            }
          });
        });

        // Função auxiliar para escape HTML
        function escapeHtml(str) {
          return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
          });
        }
      })
      .catch(err => {
        console.error('Erro ao carregar data.json:', err);
        // Fallback mínimo
        document.getElementById('pageTitle').textContent = 'PautaZero';
        document.getElementById('logoText').innerHTML = 'Pauta<span>Zero</span>';
        document.getElementById('footerLegalText').textContent = '© 2025 PautaZero. Conteúdo independente.';
      });
  })();
</script>

<!-- Ajuste para exibição das colunas de privacidade -->
<style>
  .privacy-col-content { display: none; }
  .privacy-col-title { cursor: pointer; }
  .img-placeholder, .carousel-img { width: 100%; height: 100%; object-fit: cover; }
</style>
</body>
</html>
